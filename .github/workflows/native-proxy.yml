name: Native proxy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test x86 proxy
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd native\dinput8
          call test.bat
          if errorlevel 1 exit /b 1
          call build.bat
